name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to reproduce, compare, and attest
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare reproducible release date
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/release-attestation.mjs --prepare

      - name: Check source syntax
        run: npm run check

      - name: Check wiki navigation and contract coverage
        run: npm run docs:check

      - name: Install optional automation tools
        run: npm ci --prefix automation --ignore-scripts

      - name: Run automated tests
        run: npm test

      - name: Verify portable release
        run: npm run verify

      - name: Verify HTTP and MCP companion
        run: npm run test:automation

      - name: Verify hosted site assembly
        run: |
          npm run test:site
          node scripts/build-site.mjs
          node scripts/check-site.mjs

      - name: Upload verified release
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: civitai-metadata-studio-portable
          path: |
            dist/civitai-metadata-studio.html
            dist/civitai-metadata-studio.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  attest:
    name: Attest verified release
    needs: verify
    if: >-
      github.repository == 'chriscollins500/civitai-metadata-studio' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ATTEST_EXISTING_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download tested Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: civitai-metadata-studio-portable
          path: dist

      - name: Verify artifacts and existing release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-build.mjs
          node scripts/verify-release.mjs
          node scripts/release-attestation.mjs --verify

      - name: Attest portable release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/civitai-metadata-studio.html
            dist/civitai-metadata-studio.zip
            dist/SHA256SUMS.txt

      - name: Verify the new signatures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in dist/civitai-metadata-studio.html dist/civitai-metadata-studio.zip dist/SHA256SUMS.txt; do
            gh attestation verify "$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

  pages-build:
    name: Prepare verified website
    needs: verify
    if: github.repository == 'chriscollins500/civitai-metadata-studio' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out reviewed source and portable artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Assemble the committed portable artifact without rebuilding it
        run: |
          npm run site:build
          npm run site:check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload reviewed website only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .tmp/pages

  pages-deploy:
    name: Deploy verified website
    needs: pages-build
    if: github.repository == 'chriscollins500/civitai-metadata-studio' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
