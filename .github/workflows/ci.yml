name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check source syntax
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Verify portable release
        run: npm run verify

      - name: Upload verified release
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: civitai-metadata-studio-v0.5.0
          path: |
            dist/civitai-metadata-studio.html
            dist/civitai-metadata-studio.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
