name: Bug report
description: Something does not work in the browser editor, HTTP API, MCP companion, or documentation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Metadata Studio more dependable. A small, reproducible report is more useful than a large private file.
        This is a public issue. Do not attach private images, prompts, workflows, local paths, credentials, tokens, or an unreviewed audit report.
        Suspected security vulnerability? Use the private reporting link in the issue chooser instead.

  - type: dropdown
    id: component
    attributes:
      label: Where did it happen?
      options:
        - Portable HTML editor
        - Hosted editor on GitHub Pages
        - Local HTTP API
        - MCP over stdio
        - MCP over Streamable HTTP
        - Documentation, packaging, or download verification
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Application version
      description: The application/release version; include a source commit when testing a development checkout.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Environment and versions
      description: Browser and OS for the editor; Node, OS, and client/host versions for HTTP/MCP. Do not include personal paths.
      placeholder: Current Chrome on Windows; or Node 24 with the MCP host name/version
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Image format
      options:
        - PNG or APNG
        - JPEG
        - WebP or animated WebP
        - No image required
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observable result and any safe error text.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest safe steps that reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics or screenshots
      description: Optional warning/problem codes and redacted screenshots. Include the requestId for a companion error if useful. Never include Authorization headers or full private reports.

  - type: textarea
    id: checks
    attributes:
      label: What have you checked?
      description: For example, whether the issue also occurs with automatic verification off, after reopening the saved copy, or in another current browser. Do not run destructive workarounds.

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private prompts, workflows, paths, credentials, tokens, and identifying metadata from this report.
          required: true
