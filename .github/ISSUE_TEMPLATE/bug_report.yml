name: Bug report
description: Report a reproducible Metadata Studio problem without exposing private media or metadata.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach private images, prompts, workflows, local paths, credentials, or tokens to a public issue.

  - type: input
    id: version
    attributes:
      label: Application version
      description: The version shown in the build or release filename.
      placeholder: 0.5.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Image format
      options:
        - PNG or APNG
        - JPEG
        - WebP or animated WebP
        - No image required
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observable result and any safe error text.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest safe steps that reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private prompts, workflows, paths, credentials, tokens, and identifying metadata from this report.
          required: true
